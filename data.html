<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI & Digital for Industry Navigator | Data</title>
  <link rel="shortcut icon" href="https://www.unido.org/themes/custom/unido_radix/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { screens: { sm: '300px', md: '768px', lg: '1024px' }, extend: { colors: { accent: { DEFAULT: '#7c3aed', hover: '#6d28d9' } } } } };</script>
  <link rel="stylesheet" href="css/global.css" />
</head>
<body class="flex flex-col h-full">
  <header class="flex-shrink-0 border-b custom-nav-shadow header-nav-bg-color" id="header"></header>
  <main class="flex-shrink-0 main px-4 py-8 max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-4">Data</h1>
    <p class="text-gray-600 mb-4">Demo data table. The full app provides filtering and sorting by pillars and indicators.</p>
    <div class="overflow-x-auto border rounded">
      <table class="w-full text-sm data-table">
        <thead><tr><th class="p-2 text-left">Country</th><th class="p-2 text-left">Overall stage</th></tr></thead>
        <tbody id="data-tbody"></tbody>
      </table>
    </div>
  </main>
  <footer class="footer-background-color text-white" id="footer"></footer>
  <script src="js/app.js"></script>
  <script>
    fetch('data/demo.json').then(function(r){return r.json();}).then(function(d){
      var header = document.getElementById('header');
      header.innerHTML = '<div class="lg:hidden p-4 flex items-center justify-between h-[72px]"><div class="flex items-center"><div><a href="index.html" class="block relative z-[100] h-[48px] w-[48px] object-contain"><img src="https://www.unido.org/themes/custom/unido_radix/logo.svg" alt="UNIDO Logo" class="h-full w-auto object-contain" /></a></div><div class="pl-3 max-w-[220px]"><a href="index.html"><h1 class="text-base font-semibold text-white leading-tight">AI & Digital for Industry Navigator</h1></a></div></div><div class="flex items-start gap-2"><button type="button" id="search-trigger-mobile" class="px-3 py-2 text-xs font-semibold uppercase tracking-[0.2em] text-white/70" aria-label="Search">Search</button><button type="button" id="mobile-menu-btn" class="border border-white/10 rounded-full px-3 py-2 text-white text-lg" aria-label="Menu"><span id="mobile-menu-icon">&#9776;</span></button></div></div><div class="hidden mx-auto px-6 lg:flex lg:items-center lg:justify-between lg:space-x-4 py-5"><div class="flex items-center"><div class="h-[64px] flex-shrink-0"><a href="index.html" class="block relative z-[100] h-[64px] w-[56px] object-contain"><img src="https://www.unido.org/themes/custom/unido_radix/logo.svg" alt="UNIDO Logo" class="h-full w-auto object-contain" /></a></div><div class="pl-4 max-w-[260px]"><a href="index.html"><h1 class="text-base font-semibold text-white leading-tight">AI & Digital for Industry Navigator</h1></a></div></div><div class="flex items-center justify-end space-x-10"><a href="about.html" class="text-sm text-white/70 hover:text-white font-medium">About</a><a href="data.html" class="text-sm text-white/70 hover:text-white font-medium">Data</a><a href="methodology.html" class="text-sm text-white/70 hover:text-white font-medium">Methodology</a></div><div class="flex items-center justify-end gap-3"><button type="button" id="search-trigger" class="px-3 py-2 text-xs font-semibold uppercase tracking-[0.2em] text-white/70 hover:text-white" aria-label="Search">Search</button><a href="#globe-area" class="bg-[#7c3aed] hover:bg-[#6d28d9] text-white px-4 py-2 rounded-full text-sm font-semibold">Explore</a></div></div>';
      var footer = document.getElementById('footer');
      var y = new Date().getFullYear();
      footer.innerHTML = '<div class="max-w-screen-xl mx-auto px-6 lg:px-12 py-10 text-white"><div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6"><div class="flex flex-row items-center space-x-0"><div class="w-[48px] flex-shrink-0"><img src="https://www.unido.org/sites/default/files/2022-12/unido-logo-white.png" width="48" height="60" alt="UNIDO" class="object-contain" /></div><div class="text-sm pl-3 font-normal text-white/70"><span>United Nations Industrial Development Organization</span></div></div><div class="flex flex-wrap justify-center lg:justify-end gap-6 text-sm text-white/60"><a href="https://www.facebook.com/UNIDO" target="_blank" rel="noopener noreferrer" class="hover:text-white">Facebook</a><a href="https://www.linkedin.com/company/unido" target="_blank" rel="noopener noreferrer" class="hover:text-white">LinkedIn</a><a href="https://www.instagram.com/unido" target="_blank" rel="noopener noreferrer" class="hover:text-white">Instagram</a><a href="https://twitter.com/UNIDO" target="_blank" rel="noopener noreferrer" class="hover:text-white">X</a><a href="https://www.youtube.com/unido" target="_blank" rel="noopener noreferrer" class="hover:text-white">YouTube</a></div></div><div class="border-t border-white/10 w-full mt-6 pt-6 flex flex-col sm:flex-row justify-between items-center gap-2 text-xs text-white/50 uppercase tracking-[0.2em]"><p>&copy; '+y+' UNIDO</p><a href="https://www.unido.org" class="hover:text-white">Terms of use</a></div></div>';
      var tbody = document.getElementById('data-tbody');
      (d.globeData || []).forEach(function(c){ var row = document.createElement('tr'); row.innerHTML = '<td class="p-2 border-t"><a href="country.html?code='+c.alpha3+'#'+c.alpha3+'" class="text-[#7c3aed] hover:underline">'+c.name+'</a></td><td class="p-2 border-t">'+(c.scores && c.scores.Overall && c.scores.Overall.stage ? c.scores.Overall.stage.name : '-')+'</td>'; tbody.appendChild(row); });
    });
  </script>
</body>
</html>
