<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI & Digital for Industry Navigator | Data</title>
  <link rel="shortcut icon" href="https://www.unido.org/themes/custom/unido_radix/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        screens: { sm: '300px', md: '768px', lg: '1024px' },
        extend: {
          colors: {
            accent: { DEFAULT: '#00A3E0', hover: '#0891B2' }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/global.css" />
  <script>
    // Apply theme immediately to prevent flash
    (function() {
      try {
        var theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.toggle('theme-light', theme === 'light');
        document.documentElement.classList.toggle('theme-dark', theme !== 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body class="flex flex-col h-full">
  <div id="app" class="flex flex-col h-full">
    <header class="flex-shrink-0 border-b custom-nav-shadow header-nav-bg-color" id="header"></header>
    <main class="flex-1 theme-bg theme-text overflow-hidden">
      <div class="flex flex-col lg:flex-row h-full">
        <!-- Filter Sidebar -->
        <aside id="data-filters-sidebar" class="lg:w-80 lg:border-r lg:h-full lg:overflow-y-auto border-b lg:border-b-0 theme-border" style="background-color: var(--card-bg);">
          <div class="p-6">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-bold" style="color: var(--text);">Filters</h2>
              <button id="toggle-filters-mobile" class="lg:hidden px-3 py-1 rounded border text-sm theme-border theme-text" style="background-color: var(--controls-bg);">
                Hide
              </button>
            </div>
            <div id="data-filters"></div>
          </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col overflow-hidden">
          <!-- Header Bar -->
          <div class="flex-shrink-0 px-4 lg:px-6 py-4 border-b theme-border" style="background-color: var(--card-bg);">
            <div class="flex items-center justify-between flex-wrap gap-4">
              <div>
                <h1 class="text-2xl lg:text-3xl font-bold mb-1" style="color: var(--text);">Data</h1>
                <p class="text-sm" style="color: var(--muted);">
                  Showing <span id="result-count" class="font-semibold" style="color: var(--text);">0</span> of 
                  <span id="total-count" class="font-semibold" style="color: var(--text);">0</span> countries
                </p>
              </div>
              <button id="toggle-filters-mobile-show" class="lg:hidden px-4 py-2 rounded-lg border text-sm font-medium theme-border theme-text" style="background-color: var(--controls-bg);">
                Show Filters
              </button>
            </div>
            <!-- Filter Badges -->
            <div id="filter-badges" class="mt-4"></div>
          </div>

          <!-- Table Container -->
          <div class="flex-1 overflow-auto">
            <div id="data-table-container" class="p-4 lg:p-6"></div>
          </div>
        </div>
      </div>
    </main>
    <footer class="footer-background-color theme-text" id="footer"></footer>
  </div>
  <div id="search-dialog-backdrop" class="fixed inset-0 bg-black/30 z-40 hidden"></div>
  <div id="search-dialog" class="fixed inset-0 z-50 flex items-start justify-center pt-20 hidden">
    <div class="rounded-2xl shadow-2xl max-w-md w-full mx-4 max-h-[80vh] overflow-hidden" style="background: var(--card-bg); color: var(--text); border: var(--border);">
      <div class="p-4" style="border-bottom: var(--border); background: var(--panel);">
        <label class="text-xs uppercase tracking-[0.2em] block mb-2" style="color: var(--muted);">Search countries</label>
        <input type="text" id="search-input" class="w-full rounded-xl px-3 py-2 text-sm" style="border: var(--border); color: var(--text); background: var(--controls-bg);" placeholder="Enter country name" />
      </div>
      <div id="search-results" class="overflow-y-auto max-h-64"></div>
    </div>
  </div>
  <div id="mobile-menu" class="fixed top-[75px] left-0 h-full w-full custom-mobile-bg-color z-50 shadow-lg transform -translate-x-full transition-transform duration-300" style="top: 75px;"></div>
  <script src="js/app.js"></script>
  <script src="js/data-table.js"></script>
  <script src="js/data-filters.js"></script>
  <script>
    let data = null;
    let schema = null;

    // Initialize page
    async function initDataPage() {
      try {
        // Load data
        const response = await fetch('data/demo.json');
        data = await response.json();
        
        // Load schema for pillar colors
        const schemaResponse = await fetch('data/aidin-schema.json');
        schema = await schemaResponse.json();

        // Render header and footer
        if (window.renderHeader && data.countries) {
          window.renderHeader(data.countries, false);
        }
        if (window.renderFooter) {
          window.renderFooter();
        }

        // Initialize filters
        if (window.DataFilters) {
          window.DataFilters.init(data, schema, (filteredData) => {
            // Update table with filtered data
            if (window.DataTable) {
              window.DataTable.updateFilteredData(filteredData);
            }
            // Update result count
            const resultCount = document.getElementById('result-count');
            const totalCount = document.getElementById('total-count');
            if (resultCount) resultCount.textContent = filteredData.length;
            if (totalCount) totalCount.textContent = (data.globeData || []).length;
          });
        }

        // Initialize table
        if (window.DataTable) {
          window.DataTable.init(data, schema);
          // Set initial counts
          const resultCount = document.getElementById('result-count');
          const totalCount = document.getElementById('total-count');
          if (resultCount) resultCount.textContent = (data.globeData || []).length;
          if (totalCount) totalCount.textContent = (data.globeData || []).length;
        }

        // Mobile filter toggle
        const toggleFiltersMobile = document.getElementById('toggle-filters-mobile');
        const toggleFiltersMobileShow = document.getElementById('toggle-filters-mobile-show');
        const filtersSidebar = document.getElementById('data-filters-sidebar');

        if (toggleFiltersMobile) {
          toggleFiltersMobile.addEventListener('click', () => {
            filtersSidebar.classList.add('hidden');
          });
        }

        if (toggleFiltersMobileShow) {
          toggleFiltersMobileShow.addEventListener('click', () => {
            filtersSidebar.classList.remove('hidden');
          });
        }

        // Initialize theme toggle
        if (window.initThemeToggle) {
          window.initThemeToggle();
        }
      } catch (error) {
        console.error('Error initializing data page:', error);
        const container = document.getElementById('data-table-container');
        if (container) {
          container.innerHTML = '<p class="p-8 text-center" style="color: var(--error);">Error loading data. Please refresh the page.</p>';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', initDataPage);
  </script>
</body>
</html>
