<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI & Digital for Industry Navigator | Data</title>
  <link rel="shortcut icon" href="https://www.unido.org/themes/custom/unido_radix/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { screens: { sm: '300px', md: '768px', lg: '1024px' }, extend: { colors: { accent: { DEFAULT: '#00A3E0', hover: '#0891B2' } } } } };</script>
  <link rel="stylesheet" href="css/global.css" />
  <script>
    // Apply theme immediately to prevent flash
    (function() {
      try {
        var theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.toggle('theme-light', theme === 'light');
        document.documentElement.classList.toggle('theme-dark', theme !== 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body class="flex flex-col h-full">
  <header class="flex-shrink-0 border-b custom-nav-shadow header-nav-bg-color" id="header"></header>
  <main class="flex-shrink-0 main px-4 py-8 max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-4" style="color: var(--text);">Data</h1>
    <p class="mb-4" style="color: var(--muted);">Demo data table. The full app provides filtering and sorting by pillars and indicators.</p>
    <div class="overflow-x-auto rounded" style="border: var(--border);">
      <table class="w-full text-sm data-table">
        <thead><tr><th class="p-2 text-left">Country</th><th class="p-2 text-left">Overall Tier</th></tr></thead>
        <tbody id="data-tbody"></tbody>
      </table>
    </div>
  </main>
  <footer class="footer-background-color theme-text" id="footer"></footer>
  <script src="js/app.js"></script>
  <script>
    fetch('data/demo.json').then(function(r){return r.json();}).then(function(d){
      var header = document.getElementById('header');
      header.innerHTML = '<div class="lg:hidden p-4 flex items-center justify-between h-[72px]"><div class="flex items-center"><div><a href="index.html" class="block relative z-[100] h-[48px] w-[48px] object-contain"><img src="https://www.unido.org/themes/custom/unido_radix/logo.svg" alt="UNIDO Logo" class="h-full w-auto object-contain" /></a></div><div class="pl-3 max-w-[220px]"><a href="index.html"><h1 class="text-base font-semibold text-white leading-tight">AI & Digital for Industry Navigator</h1></a></div></div><div class="flex items-start gap-2"><button type="button" id="search-trigger-mobile" class="px-3 py-2 text-xs font-semibold uppercase tracking-[0.2em] text-white/70 theme-muted" aria-label="Search">Search</button><button type="button" data-theme-toggle class="px-3 py-2 text-xs font-semibold uppercase tracking-[0.2em] text-white/70 theme-muted" aria-label="Toggle theme">Light</button><button type="button" id="mobile-menu-btn" class="border border-white/10 rounded-full px-3 py-2 text-white text-lg" aria-label="Menu"><span id="mobile-menu-icon">&#9776;</span></button></div></div><div class="hidden mx-auto px-6 lg:flex lg:items-center lg:justify-between lg:space-x-4 py-5"><div class="flex items-center"><div class="h-[64px] flex-shrink-0"><a href="index.html" class="block relative z-[100] h-[64px] w-[56px] object-contain"><img src="https://www.unido.org/themes/custom/unido_radix/logo.svg" alt="UNIDO Logo" class="h-full w-auto object-contain" /></a></div><div class="pl-4 max-w-[260px]"><a href="index.html"><h1 class="text-base font-semibold text-white leading-tight">AI & Digital for Industry Navigator</h1></a></div></div><div class="flex items-center justify-end space-x-10"><a href="about.html" class="text-sm text-white/70 hover:text-white font-medium theme-muted">About</a><a href="data.html" class="text-sm text-white/70 hover:text-white font-medium theme-muted">Data</a><a href="methodology.html" class="text-sm text-white/70 hover:text-white font-medium theme-muted">Methodology</a><a href="evidence.html" class="text-sm text-white/70 hover:text-white font-medium theme-muted">Submit Evidence</a></div><div class="flex items-center justify-end gap-3"><button type="button" id="search-trigger" class="px-3 py-2 text-xs font-semibold uppercase tracking-[0.2em] text-white/70 hover:text-white theme-muted" aria-label="Search">Search</button><button type="button" data-theme-toggle class="px-3 py-2 text-xs font-semibold uppercase tracking-[0.2em] text-white/70 hover:text-white theme-muted" aria-label="Toggle theme">Light</button><a href="#globe-area" class="bg-[#7c3aed] hover:bg-[#6d28d9] text-white px-4 py-2 rounded-full text-sm font-semibold theme-btn">Explore</a></div></div>';
      var footer = document.getElementById('footer');
      var y = new Date().getFullYear();
      footer.innerHTML = '<div class="max-w-screen-xl mx-auto px-6 lg:px-12 py-4 text-white"><div class="flex items-center justify-between text-xs text-white/60 uppercase tracking-[0.2em]"><div class="flex items-center gap-3"><img src="https://www.unido.org/sites/default/files/2022-12/unido-logo-white.png" width="32" height="40" alt="UNIDO" class="object-contain" /><span>&copy; '+y+' UNIDO</span></div><a href="https://www.unido.org" class="hover:text-white">Terms of use</a></div></div>';
      var tbody = document.getElementById('data-tbody');
      (d.globeData || []).forEach(function(c){ var row = document.createElement('tr'); row.innerHTML = '<td class="p-2 border-t"><a href="country.html?code='+c.alpha3+'#'+c.alpha3+'" class="text-[#7c3aed] hover:underline">'+c.name+'</a></td><td class="p-2 border-t">'+(c.scores && c.scores.Overall && c.scores.Overall.tier ? c.scores.Overall.tier.name : '-')+'</td>'; tbody.appendChild(row); });
      if (window.initThemeToggle) window.initThemeToggle();
    });
  </script>
</body>
</html>
