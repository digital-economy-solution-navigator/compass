<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="description" content="AI & Digital for Industry Navigator - UNIDO" />
  <title>AI & Digital for Industry Navigator | Home</title>
  <link rel="shortcut icon" href="https://www.unido.org/themes/custom/unido_radix/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        screens: { sm: '300px', md: '768px', lg: '1024px' },
        extend: {
          colors: {
            accent: { DEFAULT: '#7c3aed', hover: '#6d28d9' }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/global.css" />
</head>
<body class="flex flex-col h-full">
  <div id="app" class="flex flex-col h-full">
    <!-- Header and main content injected by JS or static below -->
    <header class="flex-shrink-0 border-b custom-nav-shadow header-nav-bg-color" id="header"></header>
    <main class="flex-1 bg-[#0b0f14]">
      <section class="relative min-h-[70vh] overflow-hidden">
        <div id="globe-area" class="absolute inset-0">
          <div id="globe-viz"></div>
          <div class="absolute inset-0 bg-gradient-to-r from-[#0b0f14]/95 via-[#0b0f14]/60 to-transparent pointer-events-none"></div>
          <div class="absolute inset-0 bg-[radial-gradient(circle_at_20%_20%,rgba(124,58,237,0.35),transparent_45%),radial-gradient(circle_at_85%_30%,rgba(34,211,238,0.25),transparent_40%)] pointer-events-none"></div>
        </div>
        <div class="relative z-10 max-w-screen-xl mx-auto px-6 lg:px-12 py-2 lg:py-3">
          <div id="pillar-filter"></div>
        </div>
        <div id="country-card-container" class="absolute left-1/2 -translate-x-1/2 bottom-6 sm:left-6 sm:translate-x-0 w-[320px] sm:w-[340px] max-w-[90vw] hidden z-20"></div>
      </section>
      <section class="bg-white text-gray-900">

      </section>
    </main>
    <footer class="footer-background-color text-white" id="footer"></footer>
  </div>
  <div id="search-dialog-backdrop" class="fixed inset-0 bg-black/30 z-40 hidden"></div>
  <div id="search-dialog" class="fixed inset-0 z-50 flex items-start justify-center pt-20 hidden">
    <div class="bg-[#0f172a] text-white rounded-2xl border border-white/10 shadow-2xl max-w-md w-full mx-4 max-h-[80vh] overflow-hidden">
      <div class="border-b border-white/10 bg-white/5 p-4">
        <label class="text-xs uppercase tracking-[0.2em] text-white/60 block mb-2">Search countries</label>
        <input type="text" id="search-input" class="w-full border border-white/10 rounded-xl px-3 py-2 text-sm text-white/80 bg-black/30 focus:border-[#7c3aed] focus:ring-1 focus:ring-[#7c3aed]" placeholder="Enter country name" />
      </div>
      <div id="search-results" class="overflow-y-auto max-h-64"></div>
    </div>
  </div>
  <div id="mobile-menu" class="fixed top-[75px] left-0 h-full w-full custom-mobile-bg-color z-50 shadow-lg transform -translate-x-full transition-transform duration-300" style="top: 75px;"></div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.45.0/dist/globe.gl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="js/app.js"></script>
</body>
</html>
