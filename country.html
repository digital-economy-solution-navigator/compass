<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="description" content="AI & Digital for Industry Navigator - UNIDO" />
  <title>AI & Digital for Industry Navigator | Country</title>
  <link rel="shortcut icon" href="https://www.unido.org/themes/custom/unido_radix/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        screens: { sm: '300px', md: '768px', lg: '1024px' },
        extend: {
          colors: {
            accent: { DEFAULT: '#00A3E0', hover: '#0891B2' }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/global.css" />
  <script>
    // Apply theme immediately to prevent flash
    (function() {
      try {
        var theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.toggle('theme-light', theme === 'light');
        document.documentElement.classList.toggle('theme-dark', theme !== 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body class="flex flex-col h-full">
  <div id="app" class="flex flex-col h-full">
    <header class="flex-shrink-0 border-b custom-nav-shadow header-nav-bg-color" id="header"></header>
    <main class="flex-shrink-0 main">
      <section class="pt-6 pb-6 relative overflow-hidden" id="country-meta" style="background: linear-gradient(135deg, var(--card-bg) 0%, rgba(0,163,224,0.05) 100%); border-bottom: var(--border);">
        <div class="absolute inset-0 opacity-5" style="background-image: radial-gradient(circle at 20% 50%, var(--brand) 0%, transparent 50%), radial-gradient(circle at 80% 80%, var(--accent) 0%, transparent 50%);"></div>
        <div class="relative z-10">
          <div class="container px-4 mx-auto">
            <div class="flex items-center justify-center gap-4 mb-4">
              <div class="rounded-full p-1.5 flex-shrink-0" style="background: var(--panel-strong); backdrop-filter: blur(10px); box-shadow: var(--shadow);">
                <span id="country-flag" class="fp fp-sm"></span>
              </div>
              <div class="text-left">
                <h1 id="country-name" class="text-2xl lg:text-3xl font-bold tracking-tight mb-0.5" style="color: var(--text);"></h1>
                <p id="country-region" class="text-xs mt-0.5 font-medium" style="color: var(--muted);"></p>
              </div>
            </div>
            <div id="score-ring-container" class="flex justify-center items-center"></div>
          </div>
        </div>
      </section>
      <section id="pillars-section" class="container px-4 mx-auto py-12"></section>
      <section id="visualizations-section" class="container px-4 mx-auto py-12" style="border-top: var(--border);">
        <div class="mb-8">
          <h2 class="text-3xl font-bold mb-2" style="color: var(--text);">Visualizations</h2>
          <p class="text-sm" style="color: var(--muted);">Interactive charts showing pillar performance</p>
        </div>
        <div class="grid md:grid-cols-2 gap-8">
          <div class="border rounded-2xl p-6 theme-border theme-card transition-all duration-300 hover:shadow-xl" style="background: var(--card-bg); box-shadow: var(--shadow);">
            <h3 class="font-semibold mb-6 text-lg" style="color: var(--text);">Pillar Radar Chart</h3>
            <div id="radar-chart-container" class="min-h-[300px]"></div>
          </div>
          <div class="border rounded-2xl p-6 theme-border theme-card transition-all duration-300 hover:shadow-xl" style="background: var(--card-bg); box-shadow: var(--shadow);">
            <h3 class="font-semibold mb-6 text-lg" style="color: var(--text);">Pillar Bar Chart</h3>
            <div id="bar-chart-container" class="min-h-[300px]"></div>
          </div>
        </div>
      </section>
      <section id="benchmarking-section" class="container px-4 mx-auto py-12" style="border-top: var(--border);">
        <div class="mb-8">
          <h2 class="text-3xl font-bold mb-2" style="color: var(--text);">Benchmarking</h2>
          <p class="text-sm" style="color: var(--muted);">Compare performance against peer groups</p>
        </div>
        <div id="benchmarking-container"></div>
      </section>
      <section id="pathways-section" class="container px-4 mx-auto py-12" style="border-top: var(--border);">
        <div class="mb-8">
          <h2 class="text-3xl font-bold mb-2" style="color: var(--text);">Transformation Pathways</h2>
          <p class="text-sm" style="color: var(--muted);">Recommended pathways for digital transformation</p>
        </div>
        <div id="pathways-container"></div>
      </section>
      <section id="indicators-section" class="container px-4 mx-auto py-12" style="border-top: var(--border);">
        <div id="indicators-container"></div>
      </section>
      <section id="sources-section" class="container px-4 mx-auto py-12" style="border-top: var(--border);">
        <div id="sources-container"></div>
      </section>
    </main>
    <footer class="footer-background-color theme-text" id="footer"></footer>
  </div>
  <div id="search-dialog-backdrop" class="fixed inset-0 bg-black/30 z-40 hidden"></div>
  <div id="search-dialog" class="fixed inset-0 z-50 flex items-start justify-center pt-20 hidden">
    <div class="rounded-2xl shadow-2xl max-w-md w-full mx-4 max-h-[80vh] overflow-hidden" style="background: var(--card-bg); color: var(--text); border: var(--border);">
      <div class="p-4" style="border-bottom: var(--border); background: var(--panel);">
        <label class="text-xs uppercase tracking-[0.2em] block mb-2" style="color: var(--muted);">Search countries</label>
        <input type="text" id="search-input" class="w-full rounded-xl px-3 py-2 text-sm" style="border: var(--border); color: var(--text); background: var(--controls-bg);" placeholder="Enter country name" />
      </div>
      <div id="search-results" class="overflow-y-auto max-h-64"></div>
    </div>
  </div>
  <div id="mobile-menu" class="fixed top-[75px] left-0 h-full w-full custom-mobile-bg-color z-50 shadow-lg transform -translate-x-full transition-transform duration-300" style="top: 75px;"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="js/app.js"></script>
  <script src="js/visualizations.js"></script>
  <script src="js/benchmarking.js"></script>
  <script src="js/pathway-navigator.js"></script>
  <script src="js/indicators-display.js"></script>
  <script>
    // Store country data globally for pathway navigator
    let countryData = null;
    let currentCountry = null;
    
    // Override initCountryPage to store data
    const originalInitCountryPage = window.initCountryPage;
    window.initCountryPage = function() {
      if (originalInitCountryPage) originalInitCountryPage();
      
      // Wait for data to load, then render new components
      setTimeout(() => {
        const data = window.getData && window.getData();
        if (data) {
          countryData = data;
          const urlParams = new URLSearchParams(window.location.search);
          const code = urlParams.get('code') || window.location.hash.replace('#', '');
          if (code && data.globeData) {
            currentCountry = data.globeData.find(c => c.alpha3 === code.toUpperCase());
            if (currentCountry) {
              renderNewComponents();
            }
          }
        }
      }, 1000);
    };
    
    function renderNewComponents() {
      if (!currentCountry || !countryData) return;
      
      // Load solutions mapping and render pathway navigator
      fetch('data/solutions-mapping.json')
        .then(res => res.json())
        .then(solutionsMapping => {
          // Render pathway navigator
          const pathwaysContainer = document.getElementById('pathways-container');
          if (pathwaysContainer && window.PathwayNavigator) {
            window.PathwayNavigator.render(currentCountry, countryData, solutionsMapping, 'pathways-container');
          }
          
          // Render visualizations
          if (window.Visualizations) {
            const radarContainer = document.getElementById('radar-chart-container');
            const barContainer = document.getElementById('bar-chart-container');
            if (radarContainer) {
              window.Visualizations.renderRadarChart(currentCountry, countryData, 'radar-chart-container');
            }
            if (barContainer) {
              window.Visualizations.renderBarChart(currentCountry, countryData, 'bar-chart-container');
            }
          }
          
          // Render benchmarking
          if (window.Benchmarking) {
            const benchmarkingContainer = document.getElementById('benchmarking-container');
            if (benchmarkingContainer) {
              window.Benchmarking.render(currentCountry, countryData, 'benchmarking-container');
            }
          }
          
          // Render indicators and sources
          if (window.IndicatorsDisplay) {
            window.IndicatorsDisplay.renderIndicators(currentCountry, countryData.ancillary);
            
            // Load sources data
            fetch('data/sources.json')
              .then(res => res.json())
              .then(sourcesData => {
                window.IndicatorsDisplay.renderSources(currentCountry, sourcesData);
              })
              .catch(err => {
                console.error('Error loading sources data:', err);
                window.IndicatorsDisplay.renderSources(currentCountry, null);
              });
          }
        })
        .catch(err => {
          console.error('Error loading solutions mapping:', err);
          // Still render other components even if solutions fail
          if (window.Visualizations) {
            const radarContainer = document.getElementById('radar-chart-container');
            const barContainer = document.getElementById('bar-chart-container');
            if (radarContainer) {
              window.Visualizations.renderRadarChart(currentCountry, countryData, 'radar-chart-container');
            }
            if (barContainer) {
              window.Visualizations.renderBarChart(currentCountry, countryData, 'bar-chart-container');
            }
          }
          if (window.Benchmarking) {
            const benchmarkingContainer = document.getElementById('benchmarking-container');
            if (benchmarkingContainer) {
              window.Benchmarking.render(currentCountry, countryData, 'benchmarking-container');
            }
          }
          
          // Render indicators and sources
          if (window.IndicatorsDisplay) {
            window.IndicatorsDisplay.renderIndicators(currentCountry, countryData.ancillary);
            fetch('data/sources.json')
              .then(res => res.json())
              .then(sourcesData => {
                window.IndicatorsDisplay.renderSources(currentCountry, sourcesData);
              })
              .catch(err => {
                console.error('Error loading sources data:', err);
                window.IndicatorsDisplay.renderSources(currentCountry, null);
              });
          }
        });
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      if (window.initCountryPage) window.initCountryPage();
    });
  </script>
</body>
</html>
